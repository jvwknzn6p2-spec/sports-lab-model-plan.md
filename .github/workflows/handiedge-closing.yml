name: HandiEdge — closing-line snapshot

# One Odds API read as close to the 23:00 JST market close as the scheduler
# allows, written to data/closing/<date>.json. Settlement compares each staked
# pick's LOCKED market probability against this closing one at the same point
# — closing-line value (CLV), the earliest honest measure of whether the
# model's edges are real: a P&L needs months to say what CLV says in weeks.
#
# Cron 13:10 UTC for the same reason predict's crons sit 50 minutes early:
# this repository's observed scheduler delay is 46–50 minutes (spikes to 117),
# so 13:10 fires ~13:56–14:00 UTC ≈ 22:56–23:00 JST, right at the close. A
# late fire is still recorded — a snapshot taken shortly after the close is
# marginally staler, not wrong, and fetchedAt says exactly when it was taken.
#
# Fail-soft everywhere: no ODDS_API_KEY, no slate, or a fetch failure means
# no snapshot, and settlement simply states no CLV for the day.
on:
  schedule:
    - cron: "10 13 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Slate date (YYYY-MM-DD). Blank = today (UTC)."
        required: false
        type: string

permissions:
  contents: write

# Never push at the same time as predict or settle.
concurrency:
  group: handiedge-data
  cancel-in-progress: false

jobs:
  closing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve date
        id: d
        run: |
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then DATE=$(date -u +%F); fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      # The command itself is fail-soft (no key / no slate → message, exit 0),
      # and continue-on-error keeps an Odds API outage from painting the
      # pipeline red — a missing snapshot only means no CLV for the day.
      - name: Snapshot closing lines
        continue-on-error: true
        working-directory: lib/sports-data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: pnpm run handiedge closing --date "${{ steps.d.outputs.date }}"

      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/sports-data/data
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "HandiEdge: closing lines ${{ steps.d.outputs.date }}"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
