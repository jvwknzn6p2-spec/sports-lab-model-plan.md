name: HandiEdge NPB — daily predictions

# NPB picks lock PER GAME: every pick freezes 33 minutes before its own
# first pitch (day, twilight and night games alike — owner's rule). Each run
# below refreshes the slate (starters firm up during the day), re-predicts
# only the games whose cut-off has NOT passed, and carries every frozen pick
# through unchanged — the freeze semantics live in the CLI, keyed on each
# game's stored lockDeadline, so extra or late runs can never rewrite a
# locked pick.
#
# Standard NPB first pitches (JST) and their −33' cut-offs:
#   13:00→12:27  14:00→13:27  17:00→16:27  17:45→17:12
#   18:00→17:27  18:15→17:42  18:30→17:57
# The EARLIEST cut-off a slate can hold is 12:27 JST (03:27 UTC).
#
# The crons are designed around the scheduler delay this repository ACTUALLY
# gets, measured 2026-08-24..09-25 from each day's first commit: the 01:00 UTC
# pass landed a median 4.7 h late (p90 5.0 h; the worst cron on the repo
# 11.5 h). The old design assumed 45–50 min (max 117 min), so its first pass
# landed ~05:40 UTC — AFTER weekend day games had started (05:00 UTC): 25
# picks were produced after first pitch, three of them staked. predict now
# withholds every market on such a row, but the only real fix is to lock in
# time, so two passes run the night before (JST):
#
#   15:10 UTC (00:10 JST) — the SAFETY pass: lands before 03:27 UTC even at
#                           the worst delay ever observed (11.5 h → 02:40).
#                           Starters are announced the day before, so the
#                           slate is complete; orders are fetched only in
#                           their 3 h window, later.
#   19:10 UTC (04:10 JST) — a second early pass.
#   01:00 .. 08:15 UTC    — the fresh re-locks per start-time cluster; with a
#                           4–5 h delay they mostly land for the night games,
#                           and the last one stamps the final picks.
#
# Runs after a pick's cut-off carry it through untouched, and once EVERY pick
# is frozen the slate is not refetched at all (no npb.jp load, no odds call).
# The date is resolved in JST at run time: 15:10 UTC is already the game day.
on:
  schedule:
    - cron: "10 15 * * *"  # 00:10 JST — safety pass: survives the worst observed delay (11.5 h) before 03:27 UTC
    - cron: "10 19 * * *"  # 04:10 JST — second early pass
    - cron: "0 1 * * *"    # 10:00 JST
    - cron: "30 2 * * *"   # 11:30 JST — aimed at the 13:00 games (lands later at today's delay)
    - cron: "30 3 * * *"   # 12:30 JST — aimed at the 14:00 games
    - cron: "30 6 * * *"   # 15:30 JST — aimed at the 17:00 games
    - cron: "15 7 * * *"   # 16:15 JST — aimed at the 17:45 games
    - cron: "45 7 * * *"   # 16:45 JST — aimed at the 18:15 games
    - cron: "15 8 * * *"   # 17:15 JST — final stamp
  workflow_dispatch:
    inputs:
      date:
        description: "Slate date (YYYY-MM-DD, JST). Blank = today in JST."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: handiedge-npb-data
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve date (JST)
        id: d
        run: |
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then DATE=$(TZ=Asia/Tokyo date +%F); fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      # Once every pick's cut-off has passed nothing can change — refetching
      # would overwrite the committed slate that PRODUCED the frozen picks,
      # load npb.jp and spend odds credits for nothing.
      - name: Is every pick already frozen?
        id: frozen
        run: |
          LOCK="lib/sports-data/data-npb/predictions/${{ steps.d.outputs.date }}.json"
          FROZEN=$(node -e '
            const fs = require("fs");
            const f = process.argv[1];
            if (!fs.existsSync(f)) { console.log("false"); process.exit(0); }
            const ps = JSON.parse(fs.readFileSync(f, "utf8")).predictions ?? [];
            const now = Date.now();
            const frozen = ps.length > 0 && ps.every((p) =>
              p.final === true ||
              (p.lockDeadline != null && Date.parse(p.lockDeadline) <= now));
            console.log(frozen ? "true" : "false");
          ' "$LOCK")
          echo "frozen=$FROZEN" >> "$GITHUB_OUTPUT"
          if [ "$FROZEN" = "true" ]; then
            echo "> Every NPB pick for ${{ steps.d.outputs.date }} is already frozen — slate kept as locked (no refetch, no odds call)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Refresh starters/stats/odds right before locking; entered lines are
      # never overwritten (create-once control tower).
      - name: Refresh NPB slate
        if: steps.frozen.outputs.frozen != 'true'
        working-directory: lib/sports-data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: pnpm run handiedge fetch-slate --league npb --date "${{ steps.d.outputs.date }}" --force

      - name: Check the slate has games
        id: guard
        run: |
          SLATE="lib/sports-data/data-npb/slates/${{ steps.d.outputs.date }}.json"
          if [ ! -f "$SLATE" ]; then
            echo "No NPB slate for ${{ steps.d.outputs.date }} — nothing to predict." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Predict and lock
        if: steps.guard.outputs.run == 'true'
        working-directory: lib/sports-data
        run: |
          pnpm run handiedge predict --league npb \
            --control "data-npb/control-towers/${{ steps.d.outputs.date }}.json" \
            --force

      # Advisory AI review of the locked slate (skips cleanly without the key).
      - name: AI review (advisory)
        if: steps.guard.outputs.run == 'true' && steps.frozen.outputs.frozen != 'true'
        working-directory: lib/sports-data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            pnpm run handiedge review --league npb --date "${{ steps.d.outputs.date }}"
          else
            echo "ANTHROPIC_API_KEY not set — review skipped."
          fi

      - name: Publish report to run summary
        if: steps.guard.outputs.run == 'true'
        run: |
          MD="lib/sports-data/data-npb/reports/${{ steps.d.outputs.date }}.md"
          if [ -f "$MD" ]; then cat "$MD" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Commit today's NPB slate and predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/sports-data/data-npb
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "HandiEdge NPB: predictions for ${{ steps.d.outputs.date }}"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
