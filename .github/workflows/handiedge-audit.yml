name: HandiEdge — standing audit

# The weekly self-audit (checklist items S-3/S-4/A-1/A-4/A-5/B-2): verify the
# store's integrity, re-score the whole history independently, check the
# simulator's spread against realized margins, and track lock margins,
# data-quality flag rates and the watched cohorts. The findings land in
# data/reports/audit.md; any error-severity finding turns this run RED so it
# gets looked at rather than scrolled past.
#
# Monday 08:23 UTC — after Monday's 07:00 UTC settle pass, off the busy
# top-of-hour minutes (this repository sees 20–26 min scheduler delays).
on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

# Shares the data lock with predict/settle so two jobs never push at once.
concurrency:
  group: handiedge-data
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Run the audit but do not stop the job yet — the report must be
      # committed even (especially) when it contains findings. The CLI's
      # exit codes disambiguate: 0 = clean, 2 = findings (report is fresh),
      # anything else = the audit itself crashed (report on disk is STALE).
      # tsx is invoked directly so the code survives the script runner.
      - name: Run standing audit
        id: audit
        working-directory: lib/sports-data
        run: |
          set +e
          pnpm exec tsx src/cli/handiedge.ts audit
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      # Only a run that actually produced a report may publish or commit it —
      # attaching last week's file to a crashed run would point the reader at
      # the wrong evidence.
      - name: Publish to run summary
        if: steps.audit.outputs.exit == '0' || steps.audit.outputs.exit == '2'
        run: cat "lib/sports-data/data/reports/audit.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit audit report
        if: steps.audit.outputs.exit == '0' || steps.audit.outputs.exit == '2'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/sports-data/data/reports/audit.md
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "HandiEdge: standing audit"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Fail on error-severity findings
        if: steps.audit.outputs.exit == '2'
        run: |
          echo "Audit found error-severity issues — see the run summary." >&2
          exit 1

      - name: Fail on audit crash
        if: steps.audit.outputs.exit != '0' && steps.audit.outputs.exit != '2'
        run: |
          echo "The audit itself crashed (exit ${{ steps.audit.outputs.exit }}) — the committed report is stale; see the 'Run standing audit' step log." >&2
          exit 1
