name: Football — data-source probe

# サッカー用データ源の到達性調査（npb-probe と同じ型）。開発サンドボックスからは
# football-data.co.uk 等へ出られない（プロキシ 403・2026-09-02 実測）ので、
# Actions のランナーから実際に取得し、probe/football/ にサンプルと manifest を残す。
# 取込パーサはこのサンプルを fixture にして作る。書き込み先は probe/football/ のみ。

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch samples
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -u
          DIR=probe/football
          mkdir -p "$DIR"
          MANIFEST="$DIR/manifest.txt"
          : > "$MANIFEST"
          echo "fetched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$MANIFEST"

          fetch () { # fetch <name> <url>（manifest に鍵は書かない）
            local name="$1" url="$2" code
            local shown="${url%%\?*}"
            code=$(curl -sSL --max-time 40 --max-filesize 6000000 \
              -A "Mozilla/5.0 (compatible; VorteFootballProbe/1.0)" \
              -o "$DIR/$name" -w "%{http_code}" "$url" || echo "ERR")
            local bytes=0
            [ -f "$DIR/$name" ] && bytes=$(wc -c < "$DIR/$name")
            echo "$code $bytes $name $shown" | tee -a "$MANIFEST"
            if [ "$code" != "200" ] || [ "$bytes" -lt 200 ]; then rm -f "$DIR/$name"; fi
          }

          # --- football-data.co.uk: 今季の結果 CSV と今後の日程（fixtures.csv・欧州のみ）
          fetch fd-fixtures.csv      "https://www.football-data.co.uk/fixtures.csv"
          fetch fd-E0-2526.csv       "https://www.football-data.co.uk/mmz4281/2526/E0.csv"
          fetch fd-E0-2627.csv       "https://www.football-data.co.uk/mmz4281/2627/E0.csv"
          fetch fd-JPN.csv           "https://www.football-data.co.uk/new/JPN.csv"
          fetch fd-I1-2526.csv   "https://www.football-data.co.uk/mmz4281/2526/I1.csv"
          fetch fd-I1-2627.csv   "https://www.football-data.co.uk/mmz4281/2627/I1.csv"
          fetch fd-SP1-2526.csv  "https://www.football-data.co.uk/mmz4281/2526/SP1.csv"
          fetch fd-SP1-2627.csv  "https://www.football-data.co.uk/mmz4281/2627/SP1.csv"
          fetch fd-D1-2526.csv   "https://www.football-data.co.uk/mmz4281/2526/D1.csv"
          fetch fd-D1-2627.csv   "https://www.football-data.co.uk/mmz4281/2627/D1.csv"
          fetch fd-N1-2526.csv   "https://www.football-data.co.uk/mmz4281/2526/N1.csv"
          fetch fd-N1-2627.csv   "https://www.football-data.co.uk/mmz4281/2627/N1.csv"
          fetch fd-F1-2526.csv   "https://www.football-data.co.uk/mmz4281/2526/F1.csv"
          fetch fd-F1-2627.csv   "https://www.football-data.co.uk/mmz4281/2627/F1.csv"
          fetch fd-P1-2526.csv   "https://www.football-data.co.uk/mmz4281/2526/P1.csv"
          fetch fd-P1-2627.csv   "https://www.football-data.co.uk/mmz4281/2627/P1.csv"
          fetch fd-B1-2526.csv   "https://www.football-data.co.uk/mmz4281/2526/B1.csv"
          fetch fd-B1-2627.csv   "https://www.football-data.co.uk/mmz4281/2627/B1.csv"
          fetch fd-SC0-2526.csv  "https://www.football-data.co.uk/mmz4281/2526/SC0.csv"
          fetch fd-SC0-2627.csv  "https://www.football-data.co.uk/mmz4281/2627/SC0.csv"
          fetch fd-japan.html        "https://www.football-data.co.uk/japan.php"

          # --- J リーグ公式（日程・結果の一次情報）
          fetch jleague-match.html   "https://www.jleague.jp/match/"
          fetch jleague-j1-standing.html "https://www.jleague.jp/standings/j1/"
          fetch jdata-search.html    "https://data.j-league.or.jp/SFMS01/search?competition_years=2026&competition_frame_ids=1&tv_relay_station_name="

          # --- xG（規約確認前・到達性だけ）
          fetch understat-epl.html   "https://understat.com/league/EPL"
          fetch fbref-j1.html        "https://fbref.com/en/comps/25/J1-League-Stats"

          # --- The Odds API: サッカーのキー一覧（鍵があるときだけ・使用量ヘッダも記録）
          if [ -n "${ODDS_API_KEY:-}" ]; then
            code=$(curl -sS --max-time 30 -o "$DIR/odds-sports.json" -D "$DIR/odds-headers.txt" -w "%{http_code}" \
              "https://api.the-odds-api.com/v4/sports/?apiKey=$ODDS_API_KEY" || echo ERR)
            echo "$code $(wc -c < "$DIR/odds-sports.json" 2>/dev/null || echo 0) odds-sports.json https://api.the-odds-api.com/v4/sports/" | tee -a "$MANIFEST"
            grep -i "x-requests-" "$DIR/odds-headers.txt" | tr -d '\r' >> "$MANIFEST" || true
            rm -f "$DIR/odds-headers.txt"
            # 今後の試合と h2h オッズ（海外 12 競技 + J1・各 1 クレジット）。日程の一次情報にもなる
            for sport in soccer_epl soccer_italy_serie_a soccer_spain_la_liga soccer_germany_bundesliga \
                         soccer_netherlands_eredivisie soccer_france_ligue_one soccer_portugal_primeira_liga \
                         soccer_belgium_first_div soccer_spl soccer_uefa_champs_league soccer_uefa_europa_league \
                         soccer_uefa_europa_conference_league soccer_japan_j_league; do
              code=$(curl -sS --max-time 30 -o "$DIR/odds-$sport.json" -w "%{http_code}" \
                "https://api.the-odds-api.com/v4/sports/$sport/odds?regions=eu&markets=h2h&oddsFormat=decimal&dateFormat=iso&apiKey=$ODDS_API_KEY" || echo ERR)
              echo "$code $(wc -c < "$DIR/odds-$sport.json" 2>/dev/null || echo 0) odds-$sport.json https://api.the-odds-api.com/v4/sports/$sport/odds" | tee -a "$MANIFEST"
            done
            python3 - <<'PY' >> "$MANIFEST" 2>/dev/null || true
          import json
          d=json.load(open('probe/football/odds-sports.json'))
          print("soccer_keys=" + ",".join(sorted(x['key'] for x in d if x.get('key','').startswith('soccer'))))
          PY
          else
            echo "ODDS_API_KEY unset — skipped odds probe" | tee -a "$MANIFEST"
          fi

      - name: football-data.co.uk の 503 を診断（本文・応答ヘッダ・UA / 経路の変種）
        # 2026-09-06 から Actions のランナーに対して全 URL が HTTP 503（489 バイト）。
        # 本文と Server ヘッダを残し（何が 503 を返しているか）、UA・スキーム・ホストの
        # 変種で応答が変わるかを見る。取得物は probe/football/fd-diag-*.txt のみ
        run: |
          set -u
          DIR=probe/football
          mkdir -p "$DIR"
          OUT="$DIR/fd-diag-manifest.txt"
          : > "$OUT"
          echo "fetched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$OUT"
          try () { # try <label> <url> <curl args...>
            local label="$1" url="$2"; shift 2
            local body="/tmp/diag-$label.bin" hdr="/tmp/diag-$label.hdr" code
            code=$(curl -sS --max-time 40 -o "$body" -D "$hdr" -w "%{http_code}" "$@" "$url" || echo ERR)
            local bytes=0; [ -f "$body" ] && bytes=$(wc -c < "$body")
            local server; server=$(grep -i '^server:' "$hdr" | tr -d '\r' | head -1)
            echo "$code $bytes $label $url [$server]" | tee -a "$OUT"
            if [ "$code" != "200" ] && [ "$bytes" -gt 0 ] && [ "$bytes" -lt 8000 ] && [ ! -f "$DIR/fd-diag-body-$code.txt" ]; then
              { echo "# $label $url"; cat "$hdr"; echo; cat "$body"; echo; } > "$DIR/fd-diag-body-$code.txt"
            fi
          }
          U="https://www.football-data.co.uk/mmz4281/2627/E0.csv"
          try bot-ua      "$U" -L -A "Mozilla/5.0 (compatible; VorteFootball/1.0)"
          try curl-ua     "$U" -L
          try chrome-ua   "$U" -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" -H "Accept: text/csv,*/*;q=0.8" -H "Accept-Language: en-GB,en;q=0.9"
          try http-scheme "http://www.football-data.co.uk/mmz4281/2627/E0.csv" -L -A "Mozilla/5.0 (compatible; VorteFootball/1.0)"
          try no-www      "https://football-data.co.uk/mmz4281/2627/E0.csv" -L -A "Mozilla/5.0 (compatible; VorteFootball/1.0)"
          try http1.1     "$U" -L --http1.1 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          try top-page    "https://www.football-data.co.uk/" -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          # 代替の履歴源（GitHub の写し・football-data.co.uk 由来・2026-09-03 まで）
          try mirror-readme "https://raw.githubusercontent.com/xgabora/Club-Football-Match-Data-2000-2025/main/README.md" -L
          # The Odds API: events（日程のみ）と scores（結果・daysFrom=3）のクレジット費用を実測する
          if [ -n "${ODDS_API_KEY:-}" ]; then
            for ep in "events?dateFormat=iso" "scores?daysFrom=3&dateFormat=iso"; do
              name=$(echo "$ep" | cut -d? -f1)
              code=$(curl -sS --max-time 30 -o "$DIR/odds-$name-soccer_epl.json" -D /tmp/oh.txt -w "%{http_code}" \
                "https://api.the-odds-api.com/v4/sports/soccer_epl/$name?${ep#*?}&apiKey=$ODDS_API_KEY" || echo ERR)
              echo "$code $(wc -c < "$DIR/odds-$name-soccer_epl.json" 2>/dev/null || echo 0) odds-$name-soccer_epl.json $(grep -i 'x-requests-' /tmp/oh.txt | tr -d '\r' | tr '\n' ' ')" | tee -a "$OUT"
            done
          fi
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Commit samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/football
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "football probe: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
