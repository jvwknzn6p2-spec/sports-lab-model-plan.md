name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (all packages)
        run: pnpm run typecheck
      - name: HandiEdge — build model + train
        run: |
          pnpm --filter @workspace/handiedge run make-history
          pnpm --filter @workspace/handiedge run train
      - name: Tests
        run: |
          pnpm --filter @workspace/ai-review run test
          pnpm --filter @workspace/pipeline run test
          pnpm --filter @workspace/handiedge run test

  python-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install engine
        run: pip install -e "prediction-engine[dev]"
      - name: Tests
        run: cd prediction-engine && PYTHONPATH=src python -m pytest -q

  handiedge-python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync (from uv.lock)
        run: cd handiedge_project && uv sync --extra dev
      - name: Lint + format + typecheck
        run: |
          cd handiedge_project
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
      - name: Tests (138)
        run: cd handiedge_project && uv run pytest
