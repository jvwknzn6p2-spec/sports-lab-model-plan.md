name: Football — daily ledger

# サッカーの日次パイプライン。毎日 03:05 UTC（12:05 JST）に 1 回:
#   1. football-data.co.uk から結果 CSV（海外 9 リーグは各 4 季、J1 は new/JPN.csv）を cache へ取得
#   2. The Odds API から 10 競技の今後の試合と h2h オッズを cache へ取得（10 クレジット/日・
#      月 300。odds.yml の MLB 分と合わせても無料枠 500/月 に収まる）
#   対象は海外優先（Founder 指示 2026-09-03）: E0 I1 SP1 D1 N1 F1 P1 B1 SC0 → JAP。
#   CL / EL / ECL は結果 CSV の一次情報が無く決済できないため未対応
#   3. lib/football-model の CLI が 日程 → 封緘前の予想発行（キックオフ 36h 以内・
#      封緘は kickoff−60 分）→ 結果の取込 → 決済 → reports/summary.md
#   4. football/ を commit（台帳は追記のみ。cache は commit しない）
# ネットワークは curl だけ。CLI はファイルしか読まない（取得時刻はファイル名に残る）。
# ODDS_API_KEY が無い間は日程・予想を出さず、結果と決済だけ動く。

on:
  schedule:
    - cron: "5 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 結果 CSV を取得（football-data.co.uk）
        run: |
          set -u
          mkdir -p football/cache
          # フェイルクローズ（2026-09-07 実測から）: football-data.co.uk が 2026-09-06〜07 に
          # HTTP 503 のエラーページ（489 バイト）を返し、旧実装（curl -o のみ）はそれを
          # 「ok 489」として保存、パーサは 0 行を返し、日次は緑のまま 2 日間「予想 0 件・
          # 決済 0 件」だった。HTTP 200 かつ見出しが Div,/Country, で始まるものだけを受理し、
          # 4 回（5/10/20 秒待ち）で取れなければジョブを落とす。欠けた季で学習した予想を
          # 黙って発行しないため、1 ファイルでも欠ければ全体を止める（結果の取込・決済も
          # この後の日次に任せる。台帳は追記専用なので翌日に取り直せば欠落しない）。
          failed=0
          get () {
            local name="$1" url="$2" out="football/cache/$1" code attempt
            for attempt in 1 2 3 4; do
              code=$(curl -sSL --max-time 60 -A "Mozilla/5.0 (compatible; VorteFootball/1.0)" -o "$out" -w "%{http_code}" "$url" || echo ERR)
              if [ "$code" = "200" ] && head -c 200 "$out" | sed '1s/^\xef\xbb\xbf//' | head -1 | grep -qE '^(Div|Country),'; then
                echo "ok $name $(wc -c < "$out")"; return 0
              fi
              echo "retry $attempt $name HTTP $code $( [ -f "$out" ] && wc -c < "$out" || echo 0) bytes"
              rm -f "$out"
              [ "$attempt" -lt 4 ] && sleep $((5 * (1 << (attempt - 1))))
            done
            echo "::error::FAIL $name HTTP $code（football-data.co.uk から CSV を取得できない）"
            failed=1
          }
          # 海外 9 リーグ × 4 季（Founder 指示 2026-09-03・J1 より優先）
          for div in E0 I1 SP1 D1 N1 F1 P1 B1 SC0; do
            for season in 2324 2425 2526 2627; do
              get "$div-$season.csv" "https://www.football-data.co.uk/mmz4281/$season/$div.csv"
            done
          done
          get JPN.csv     "https://www.football-data.co.uk/new/JPN.csv"
          if [ "$failed" -ne 0 ]; then
            echo "::error::結果 CSV が揃わないため日次を止める（予想の発行・決済・コミットを行わない）"
            exit 1
          fi

      - name: 日程とオッズを取得（The Odds API・鍵が無ければ飛ばす）
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -u
          if [ -z "${ODDS_API_KEY:-}" ]; then echo "ODDS_API_KEY unset — skip"; exit 0; fi
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          for sport in soccer_epl soccer_italy_serie_a soccer_spain_la_liga soccer_germany_bundesliga \
                       soccer_netherlands_eredivisie soccer_france_ligue_one soccer_portugal_primeira_liga \
                       soccer_belgium_first_div soccer_spl soccer_japan_j_league; do
            mkdir -p "football/cache/odds/$sport"
            code=$(curl -sS --max-time 30 -o "football/cache/odds/$sport/$ts.json" -D /tmp/h.txt -w "%{http_code}" \
              "https://api.the-odds-api.com/v4/sports/$sport/odds?regions=eu&markets=h2h&oddsFormat=decimal&dateFormat=iso&apiKey=$ODDS_API_KEY")
            echo "$sport HTTP $code $(grep -i x-requests-remaining /tmp/h.txt | tr -d '\r')"
            if [ "$code" != "200" ]; then rm -f "football/cache/odds/$sport/$ts.json"; fi
          done

      - name: 日次パイプライン
        run: node --experimental-strip-types lib/football-model/src/cli/football.ts daily --root football --cache football/cache --leagues E0,I1,SP1,D1,N1,F1,P1,B1,SC0,JAP

      - name: コミット（台帳・市場の写し・レポート）
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football/ledger football/market football/reports
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "football: $(date -u +%Y-%m-%dT%H:%MZ) ledger"
          for i in 1 2 3; do
            if git push origin HEAD; then exit 0; fi
            git fetch origin && git rebase origin/main
          done
          git push origin HEAD
