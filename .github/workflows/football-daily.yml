name: Football — daily ledger

# サッカーの日次パイプライン。毎日 22:05 UTC（07:05 JST）に 1 回:
#   1. 結果の取得（どれが欠けても止めない。学習データは football/history が権威）:
#      a. football-data.co.uk の結果 CSV（海外 9 リーグは各 4 季、J1 は new/JPN.csv）
#         ホストは **www. 無し**（https://football-data.co.uk/…）を先に叩き、失敗したら www. を試す。
#         2026-09-06〜09 に www. ホストの前段（nginx）が全 URL に 503（489 バイト）を返す一方、
#         www. 無し（Apache 直）は 200 だった（probe 2026-09-09 実測）
#      b. GitHub の写し（xgabora/Club-Football-Match-Data・football-data.co.uk 由来・不定期更新）
#      c. The Odds API の scores（結果の速報・2 クレジット/競技）。未決済の予想があり、その
#         キックオフから 2 時間〜3 日の競技だけ要求する（毎日 10 競技だと月 600 で無料枠 500 を超える）
#   2. The Odds API から 10 競技の今後の試合と h2h オッズを cache へ取得（10 クレジット/日・
#      月 300。odds.yml の MLB 分と合わせても無料枠 500/月 に収まる）
#      対象は海外優先（Founder 指示 2026-09-03）: E0 I1 SP1 D1 N1 F1 P1 B1 SC0 → JAP。
#      CL / EL / ECL は結果 CSV の一次情報が無く決済できないため未対応
#   3. lib/football-model の CLI が 履歴の更新（football/history・差分の追記）→ 日程 →
#      封緘前の予想発行（キックオフ 48h 以内・封緘は試合日（JST）の前日 20:00 JST・
#      Founder 確定 2026-09-09）→ 結果の取込 → 決済 → reports/summary.md
#   実行時刻を 07:05 JST にしているのは、このアカウントの schedule 実行が実測で
#   4.5〜5 時間遅れて着地するため（9/3〜9/8 の 6 回: 4h30m〜5h06m）。12:05 JST では
#   着地が 17:00 前後になり、封緘 20:00 JST までの余裕が 3 時間を切る。07:05 なら
#   着地は 12:00 前後で、翌日（JST）の試合の封緘まで 8 時間ある。
#   窓が 48h なのは、着地時刻から翌日（JST）の最終試合（最大 41h 先）を全て拾うため
#   4. football/ を commit（台帳は追記のみ・履歴は差分更新。cache は commit しない）
# ネットワークは curl だけ。CLI はファイルしか読まない（取得時刻はファイル名に残る）。
# ODDS_API_KEY が無い間は日程・予想を出さず、結果と決済だけ動く。
# 取得元が全て落ちた日も、前日までの履歴で予想は出る（予想行の historyAsOf /
# historyMissing に鮮度が残る）。「予想は試合前に必ず出す」（Founder 指示 2026-09-09）
# を取得元の生死から切り離すための設計で、2026-09-06〜09 に 4 日間 1 件も出なかった実発生から

on:
  schedule:
    - cron: "5 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 結果 CSV を取得（football-data.co.uk・欠けても止めない）
        run: |
          set -u
          mkdir -p football/cache
          # HTTP 200 かつ見出しが Div,/Country, で始まるものだけを受理する（2026-09-06〜07 に
          # 503 のエラーページを CSV として保存し、日次が緑のまま予想 0 件だった実発生から）。
          # 取れなかったファイルは cache に置かない（CLI は無い分を飛ばし、履歴で学習する）。
          # ホストは www. 無しを先に（www. の前段 nginx が 503 を返す間も Apache 直は 200・2026-09-09 実測）
          # サイトが丸ごと落ちている日に 37 ファイル × 2 ホスト × 2 回を総当たりしても、
          # 同じ失敗を 148 回繰り返すだけで 7 分 43 秒かかる（2026-09-17 実測）。
          # 先頭 2 ファイルが両ホストで落ちたら「全滅」と判断して残りを飛ばす（fail-fast）。
          # 併せて **リダイレクト先を記録する**。2026-09-16〜 の障害は HTTP 302 →
          # 127.0.0.1:80 への転送で、ログに Location が無いため原因の特定に本番ログの
          # ダウンロードが要った。次に同じことが起きたら 1 行目で分かるようにする。
          failed=0
          attempted=0
          down=0
          first_redirect=""
          get () {
            local name="$1" path="$2" out="football/cache/$1" code host attempt redir meta
            if [ "$down" = "1" ]; then failed=$((failed + 1)); return 0; fi
            attempted=$((attempted + 1))
            for host in football-data.co.uk www.football-data.co.uk; do
              for attempt in 1 2; do
                # --proto-redir =https: http:// への転送は追わずに落とす（127.0.0.1:80 への
                # 転送を「接続失敗」ではなく「転送拒否」として見せ、待ち時間も作らない）
                meta=$(curl -sSL --max-time 60 --proto-redir =https -A "Mozilla/5.0 (compatible; VorteFootball/1.0)" -o "$out" -w "%{http_code} %{redirect_url}" "https://$host/$path" || echo "ERR -")
                code=${meta%% *}; redir=${meta#* }
                if [ "$code" = "200" ] && head -c 200 "$out" | sed '1s/^\xef\xbb\xbf//' | head -1 | grep -qE '^(Div|Country),'; then
                  echo "ok $name $(wc -c < "$out") via $host"; return 0
                fi
                echo "retry $host $attempt $name HTTP $code redirect=${redir:--} $( [ -f "$out" ] && wc -c < "$out" || echo 0) bytes"
                [ -z "$first_redirect" ] && [ -n "$redir" ] && [ "$redir" != "-" ] && first_redirect="$redir"
                rm -f "$out"
                [ "$attempt" -lt 2 ] && sleep 5
              done
            done
            echo "::warning::FAIL $name HTTP $code（football-data.co.uk から取得できない。履歴と他の取得元で進む）"
            failed=$((failed + 1))
            # 2 ファイル続けて両ホストで落ちたら、以降は試さない（残りも同じ結果になる）
            if [ "$failed" -ge 2 ] && [ "$failed" = "$attempted" ]; then
              down=1
              echo "::warning::football-data.co.uk が全滅と判断（先頭 $attempted 件が両ホストで失敗）。残りは試さない"
            fi
          }
          # 海外 9 リーグ × 4 季（Founder 指示 2026-09-03・J1 より優先）
          for div in E0 I1 SP1 D1 N1 F1 P1 B1 SC0; do
            for season in 2324 2425 2526 2627; do
              get "$div-$season.csv" "mmz4281/$season/$div.csv"
            done
          done
          get JPN.csv "new/JPN.csv"
          # 今後の試合 + 各ブックのオッズ（無料・無制限）。The Odds API のクレジットが
          # 尽きた日に 122 件が市場無しで封緘された（2026-09-18 実発生）ことへの備えで、
          # **クレジットを使わない第 2 の市場**として持つ。収録は約 3 日先まで・J1 は対象外
          get fixtures.csv "fixtures.csv"
          echo "football-data: failed $failed / 38 (試行 $attempted)"
          if [ -n "$first_redirect" ]; then echo "::warning::最初の転送先: $first_redirect（ここが 127.0.0.1 等ならサイト側の遮断）"; fi
          if [ "$failed" -eq 38 ]; then echo "::warning::football-data.co.uk が全滅（両ホスト）。履歴・写し・Odds API scores で進む"; fi

      - name: 結果の写しを取得（GitHub・xgabora/Club-Football-Match-Data・欠けても止めない）
        run: |
          set -u
          out=football/cache/mirror-Matches.csv
          code=$(curl -sSL --max-time 300 -o "$out" -w "%{http_code}" \
            "https://raw.githubusercontent.com/xgabora/Club-Football-Match-Data-2000-2025/main/data/Matches.csv" || echo ERR)
          if [ "$code" = "200" ] && head -c 100 "$out" | grep -q '^Division,MatchDate'; then
            echo "ok mirror $(wc -c < "$out") bytes, last row: $(tail -1 "$out" | cut -d, -f1-5)"
          else
            echo "::warning::mirror HTTP $code（写しが取れない。履歴と他の取得元で進む）"; rm -f "$out"
          fi

      - name: 日程とオッズを取得（The Odds API・鍵が無ければ飛ばす）
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -u
          if [ -z "${ODDS_API_KEY:-}" ]; then echo "ODDS_API_KEY unset — skip"; exit 0; fi
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          # J1（soccer_japan_j_league）は 2026-09-19 に対象から外した（Founder 判断）。
          # 無料の fixtures.csv に J1 が収録されておらず、市場を持つには有料枠を使うしかない
          # 一方で、モデルの成績は 10 リーグで最も悪い（RPS 0.2896 対 他は約 0.20）。
          # **台帳からは消さない**。登録済みの J1 の試合は予想・決済とも従来どおり続き、
          # 新しい日程が入らなくなることで自然に終わる
          for sport in soccer_epl soccer_italy_serie_a soccer_spain_la_liga soccer_germany_bundesliga \
                       soccer_netherlands_eredivisie soccer_france_ligue_one soccer_portugal_primeira_liga \
                       soccer_belgium_first_div soccer_spl; do
            mkdir -p "football/cache/odds/$sport"
            code=$(curl -sS --max-time 30 -o "football/cache/odds/$sport/$ts.json" -D /tmp/h.txt -w "%{http_code}" \
              "https://api.the-odds-api.com/v4/sports/$sport/odds?regions=eu&markets=h2h&oddsFormat=decimal&dateFormat=iso&apiKey=$ODDS_API_KEY")
            echo "$sport HTTP $code $(grep -i x-requests-remaining /tmp/h.txt | tr -d '\r')"
            if [ "$code" != "200" ]; then rm -f "football/cache/odds/$sport/$ts.json"; fi
            grep -i '^x-requests-remaining:' /tmp/h.txt | tr -d '\r' | awk '{print $2}' > football/cache/odds-remaining.txt || true
          done

      - name: 結果の速報を取得（The Odds API scores・必要な競技だけ・鍵が無ければ飛ばす）
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -u
          if [ -z "${ODDS_API_KEY:-}" ]; then echo "ODDS_API_KEY unset — skip"; exit 0; fi
          # 未決済の予想があり、キックオフから 2 時間〜3 日の競技（CLI が台帳から決める）。
          # daysFrom=3 は 2 クレジット/競技。残りが 40 を切ったら翌日の日程・オッズ（10/日）を守るため飛ばす
          remaining=$(cat football/cache/odds-remaining.txt 2>/dev/null || echo 999)
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          node --experimental-strip-types lib/football-model/src/cli/football.ts scores-needed --root football --leagues E0,I1,SP1,D1,N1,F1,P1,B1,SC0,JAP > /tmp/scores-needed.txt
          echo "scores needed: $(tr '\n' ' ' < /tmp/scores-needed.txt) (remaining $remaining)"
          while read -r sport; do
            [ -z "$sport" ] && continue
            if [ "$remaining" -lt 40 ] 2>/dev/null; then echo "::warning::クレジット残 $remaining < 40 のため scores を飛ばす（$sport）"; continue; fi
            mkdir -p "football/cache/scores/$sport"
            code=$(curl -sS --max-time 30 -o "football/cache/scores/$sport/$ts.json" -D /tmp/h.txt -w "%{http_code}" \
              "https://api.the-odds-api.com/v4/sports/$sport/scores?daysFrom=3&dateFormat=iso&apiKey=$ODDS_API_KEY")
            echo "$sport scores HTTP $code $(grep -i x-requests- /tmp/h.txt | tr -d '\r' | tr '\n' ' ')"
            if [ "$code" != "200" ]; then rm -f "football/cache/scores/$sport/$ts.json"; fi
            remaining=$(grep -i '^x-requests-remaining:' /tmp/h.txt | tr -d '\r' | awk '{print $2}' || echo "$remaining")
          done < /tmp/scores-needed.txt

      - name: 結果を取得（football-data.org v4・トークンが無ければ飛ばす）
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
        run: |
          set -u
          # football-data.co.uk が 9/13〜9/17 の内容で凍結し、写しも Odds API scores も
          # 使えず、結果の取得元が同時に 3 つとも死んだ（2026-09-21 実測・決済待ち 90 件）。
          # co.uk 由来でない独立した経路として足す。**結果だけ**で、日程にも市場にも使わない。
          # トークン未設定の間は何もせず成功終了する（archive.yml と同じ流儀）
          if [ -z "${FOOTBALL_DATA_ORG_TOKEN:-}" ]; then echo "FOOTBALL_DATA_ORG_TOKEN unset — skip"; exit 0; fi
          mkdir -p football/cache/fdorg
          from=$(date -u -d '14 days ago' +%F)
          to=$(date -u -d '1 day' +%F)
          # 無料枠は 10 リクエスト/分。7 競技なので 7 秒おきに 1 本で十分収まる
          for comp in PL BL1 SA PD FL1 PPL DED; do
            out="football/cache/fdorg/$comp.json"
            code=$(curl -sS --max-time 30 -o "$out" -D /tmp/fdorg-h.txt -w "%{http_code}" \
              -H "X-Auth-Token: $FOOTBALL_DATA_ORG_TOKEN" \
              "https://api.football-data.org/v4/competitions/$comp/matches?dateFrom=$from&dateTo=$to")
            n=0
            if [ "$code" = "200" ]; then n=$(grep -o '"status"' "$out" | wc -l); else rm -f "$out"; fi
            # 発行元の案内どおり、残り回数のヘッダを記録する。**名前を決め打ちしない**
            # （X-Requests-Available-Minute 等の綴りを記憶で書くと、違っていても静かに
            # 空振りする）。X- で始まる応答ヘッダをそのまま出し、実物を見てから絞る
            hdr=$(grep -i '^x-' /tmp/fdorg-h.txt | grep -iv '^x-auth' | tr -d '\r' | tr '\n' ' ')
            echo "fdorg $comp HTTP $code ($n 件) $hdr"
            rm -f /tmp/fdorg-h.txt
            sleep 7
          done

      - name: 日次パイプライン
        run: node --experimental-strip-types lib/football-model/src/cli/football.ts daily --root football --cache football/cache --leagues E0,I1,SP1,D1,N1,F1,P1,B1,SC0,JAP

      - name: コミット（台帳・市場の写し・レポート）
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football/ledger football/history football/market football/reports
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "football: $(date -u +%Y-%m-%dT%H:%MZ) ledger"
          for i in 1 2 3; do
            if git push origin HEAD; then exit 0; fi
            git fetch origin && git rebase origin/main
          done
          git push origin HEAD

      # 取得は「欠けても止めない」設計なので、取得元が全滅した日も上の手順はすべて成功で
      # 終わる。**つまり記録が凍っていることは緑のログからは見えない**（2026-09-16〜17 に
      # 実発生: 3 経路同時障害で結果 0 件のまま日次が 2 回成功した）。ここだけが声を出す。
      # 36 時間で警告・72 時間（日次 3 回連続で結果 0 件）で失敗。閾値の根拠は src/health.ts。
      # **commit の後に置く**。落として run を赤くしても、取れたぶんの追記は済んでいる。
      - name: 取込の健全性（結果が入らなくなっていたら run を赤くする）
        run: node --experimental-strip-types lib/football-model/src/cli/football.ts health --root football
