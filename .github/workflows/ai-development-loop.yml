name: AI Sports Log — Astra Audit

# The guarded development loop — policy in .ai/ASTRA_REVIEW_POLICY.md, setup
# and the step-by-step picture in .ai/ASTRA_LOOP_SETUP.md.
#
# Read-only with respect to the repository: this workflow never pushes,
# never merges, never touches secrets, never writes to the ledgers. Its only
# writes are PR comments (the audit, and — only when the repository variable
# AUTO_CLAUDE_FIX is "true" — an @claude repair request). Evidence handed to
# Astra is generated on the PR head from the COMMITTED ledgers; nothing is
# fabricated and nothing is fetched from the network for the evaluation.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: astra-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  PYTHON_VERSION: "3.12"
  MAX_AI_REPAIR_ROUNDS: "3"

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the diff below is taken against the base branch

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Real stored predictions/results → one CSV, before the tests so the
      # real-data smoke test validates this very file instead of regenerating it.
      - name: Export evaluation data
        id: export
        continue-on-error: true
        run: |
          mkdir -p reports # the later `tee`s append here even if the export fails
          python scripts/export_evaluation.py --output data/evaluation/predictions_eval.csv --manifest reports/evaluation_export.json

      # Operating-record monitor: the locked calibrated probability against the
      # locked raw one. It is NOT a property of this PR's diff, so only its
      # validity gates (exit 2 = invalid data); a regression here is reported.
      - name: Evaluate operating record
        id: evaluation
        continue-on-error: true
        run: |
          python scripts/evaluate_model.py --input data/evaluation/predictions_eval.csv --output reports/latest_evaluation.json --cluster-by event_date 2>&1 | tee reports/evaluation.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      # PR evaluation proper (judgment 2): replay every committed MLB lock from
      # its committed slate with the HEAD code and with the BASE code, on the
      # very same input files, seal both, and compare on the common rows.
      # NPB and soccer are not connected here (stated in the manifest).
      - name: Replay MLB locks (head)
        id: replay_head
        continue-on-error: true
        working-directory: lib/sports-data
        env:
          HANDIEDGE_CODE_VERSION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm exec tsx src/cli/handiedge.ts replay --out "$GITHUB_WORKSPACE/reports/replay/head" 2>&1 | tail -5

      - name: Replay MLB locks (base)
        id: replay_base
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach /tmp/base "$BASE_SHA"
          if ! grep -q '"replay"' /tmp/base/lib/sports-data/src/cli/handiedge.ts; then
            echo "::warning::base $BASE_SHA has no replay command — baseline replay unavailable; the PR evaluation cannot pass"
            exit 1
          fi
          (cd /tmp/base && pnpm install --frozen-lockfile --silent)
          (cd /tmp/base/lib/sports-data && HANDIEDGE_CODE_VERSION="$BASE_SHA" pnpm exec tsx src/cli/handiedge.ts replay \
              --data-dir "$GITHUB_WORKSPACE/lib/sports-data/data" --out "$GITHUB_WORKSPACE/reports/replay/base" 2>&1 | tail -5)

      - name: Verify replay provenance
        id: replay_check
        if: steps.replay_head.outcome == 'success'
        continue-on-error: true
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          h=$(jq -r .codeVersion reports/replay/head/manifest.json)
          test "$h" = "$HEAD_SHA" || { echo "head replay codeVersion $h != $HEAD_SHA"; exit 1; }
          jq -e '.source == "replay"' reports/replay/head/manifest.json > /dev/null
          for f in reports/replay/head/2*.json; do
            want=$(jq -r --arg f "$(basename "$f")" '.dates[] | select(.file == $f) | .sha256' reports/replay/head/manifest.json)
            got=$(sha256sum "$f" | cut -d' ' -f1)
            test "$want" = "$got" || { echo "hash mismatch for $f"; exit 1; }
          done
          if [ -f reports/replay/base/manifest.json ]; then
            b=$(jq -r .codeVersion reports/replay/base/manifest.json)
            test "$b" = "$BASE_SHA" || { echo "base replay codeVersion $b != $BASE_SHA"; exit 1; }
          fi
          echo "replay provenance verified: head=$h base=${b:-unavailable}"

      - name: Evaluate PR (head vs base replay)
        id: replay_eval
        if: steps.replay_head.outcome == 'success' && steps.replay_base.outcome == 'success' && steps.replay_check.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/export_evaluation.py --sports mlb \
            --candidate-mlb-dir reports/replay/head --baseline-mlb-dir reports/replay/base \
            --output data/evaluation/predictions_eval_replay.csv --manifest reports/evaluation_export_replay.json
          python scripts/evaluate_model.py --input data/evaluation/predictions_eval_replay.csv \
            --output reports/replay_evaluation.json --cluster-by event_date 2>&1 | tee reports/replay_evaluation.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      # The same suite list as ci.yml (root package.json fans `test` and
      # `typecheck:test` out to every package) plus the Python tests. Each
      # step records instead of failing so Astra always gets the full log;
      # the gate at the end reads the step outcomes.
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: pnpm run typecheck 2>&1 | tee -a reports/tests.log; exit "${PIPESTATUS[0]}"

      - name: Test (node packages)
        id: test_node
        continue-on-error: true
        run: |
          { pnpm run typecheck:test && pnpm test; } 2>&1 | tee -a reports/tests.log; exit "${PIPESTATUS[0]}"

      - name: Test (python)
        id: test_py
        continue-on-error: true
        env:
          EVAL_CSV: data/evaluation/predictions_eval.csv
        run: python -m pytest -q tests 2>&1 | tee -a reports/tests.log; exit "${PIPESTATUS[0]}"

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-evidence-${{ github.run_id }}
          path: |
            reports/
            data/evaluation/
          if-no-files-found: ignore
          retention-days: 30

      - name: Prepare diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --no-color "origin/${{ github.base_ref }}...HEAD" | head -c 120000 > /tmp/pr.diff || true
          else
            git show --no-color --stat --patch HEAD | head -c 120000 > /tmp/pr.diff || true
          fi

      - name: Verify Astra API secret
        id: openai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; else echo "configured=false" >> "$GITHUB_OUTPUT"; fi

      - name: Astra audit
        id: astra
        if: steps.openai.outputs.configured == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TEST_STATUS: ${{ steps.typecheck.outcome == 'success' && steps.test_node.outcome == 'success' && steps.test_py.outcome == 'success' && 'PASS' || 'FAIL' }}
        run: |
          # The evaluator always writes a report (NOT_RUN / INVALID / PASS /
          # REGRESSION); a missing file means the evaluator itself crashed.
          [ -f reports/latest_evaluation.json ] || echo '{"status":"EVALUATOR_CRASHED"}' > reports/latest_evaluation.json
          [ -f reports/evaluation_export.json ] || echo '{"status":"EXPORT_NOT_RUN"}' > reports/evaluation_export.json
          [ -f reports/tests.log ] || echo 'no test output' > reports/tests.log
          [ -f reports/replay_evaluation.json ] || echo '{"status":"NOT_RUN","reason":"replay evaluation did not run (base replay unavailable or replay failed)"}' > reports/replay_evaluation.json
          [ -f reports/evaluation_export_replay.json ] || echo '{"status":"NOT_RUN"}' > reports/evaluation_export_replay.json
          jq -n \
            --rawfile policy .ai/ASTRA_REVIEW_POLICY.md \
            --arg teststatus "$TEST_STATUS" \
            --rawfile tests reports/tests.log \
            --rawfile evaluation reports/latest_evaluation.json \
            --rawfile manifest reports/evaluation_export.json \
            --rawfile replay reports/replay_evaluation.json \
            --rawfile replaymanifest reports/evaluation_export_replay.json \
            --rawfile diff /tmp/pr.diff \
            '{model:"gpt-6-astra", reasoning:{effort:"high"}, max_output_tokens:12000, input:("You are the Chief Model Auditor for AI Sports Log. Follow the policy exactly. Never invent evidence. A PASS is forbidden if tests failed, evaluation is invalid/regressed, leakage is credible, or settlement semantics are corrupted.\n\nREVIEW POLICY:\n"+$policy+"\n\nTEST RESULTS (overall: "+$teststatus+"):\n"+$tests+"\n\nOPERATING-RECORD EXPORT MANIFEST (counts and exclusion reasons):\n"+$manifest+"\n\nOPERATING-RECORD EVALUATION (monitor, not a property of the diff):\n"+$evaluation+"\n\nPR REPLAY EXPORT MANIFEST (head vs base on identical inputs):\n"+$replaymanifest+"\n\nPR REPLAY EVALUATION (the diff's evidence; block bootstrap by date gates):\n"+$replay+"\n\nPR DIFF:\n"+$diff+"\n\nReturn the policy-required format; first line must be DECISION: PASS, DECISION: FIX_REQUIRED, or DECISION: REJECT.")}' \
            > /tmp/astra_request.json

          code=$(curl -sS -o /tmp/astra_response.json -w "%{http_code}" https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/astra_request.json)
          test "$code" -ge 200 -a "$code" -lt 300 || { cat /tmp/astra_response.json; exit 1; }

          jq -r '[.output[]? | select(.type=="message") | .content[]? | select(.type=="output_text") | .text] | join("\n")' /tmp/astra_response.json > /tmp/astra_review.md
          test -s /tmp/astra_review.md || { echo "No Astra output_text"; exit 1; }
          decision=$(head -n 1 /tmp/astra_review.md | sed 's/^DECISION: //')
          case "$decision" in PASS|FIX_REQUIRED|REJECT) ;; *) echo "Invalid Astra decision: $decision"; exit 1;; esac
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          { echo "## GPT-6 Astra audit"; echo; cat /tmp/astra_review.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment audit on PR
        if: github.event_name == 'pull_request' && steps.astra.outputs.decision != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '<!-- astra-audit -->'; echo '## GPT-6 Astra audit'; echo; cat /tmp/astra_review.md; echo; echo '---'; echo 'Tests: `${{ steps.typecheck.outcome == 'success' && steps.test_node.outcome == 'success' && steps.test_py.outcome == 'success' && 'PASS' || 'FAIL' }}`'; echo 'Evaluator exit: `${{ steps.evaluation.outputs.exit_code }}`'; } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md

      # A comment posted with GITHUB_TOKEN never starts another workflow, so
      # the @claude request only wakes claude.yml when posted with AI_LOOP_PAT
      # (.ai/ASTRA_LOOP_SETUP.md). Without it the request is still recorded on
      # the PR, and the step says so, for a human to forward.
      - name: Optional Claude repair request
        if: github.event_name == 'pull_request' && steps.astra.outputs.decision == 'FIX_REQUIRED' && vars.AUTO_CLAUDE_FIX == 'true'
        env:
          GH_TOKEN: ${{ secrets.AI_LOOP_PAT || github.token }}
          HAS_PAT: ${{ secrets.AI_LOOP_PAT != '' }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          prior=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate --jq '[.[] | select(.body | contains("<!-- ai-loop-round:"))] | length' | awk '{s+=$1} END{print s+0}')
          round=$((prior+1))
          if [ "$round" -gt "$MAX_AI_REPAIR_ROUNDS" ]; then gh pr comment "$PR" --body "AI repair loop stopped after $MAX_AI_REPAIR_ROUNDS rounds. Founder review required."; exit 1; fi
          { echo "<!-- ai-loop-round:$round -->"; echo '@claude Astra returned FIX_REQUIRED. Repair this PR without changing unrelated code. Add/update tests, preserve settlement rules, re-run evaluation, do not merge/force-push/delete data/modify secrets, and push to this same PR.'; echo; cat /tmp/astra_review.md; } > /tmp/claude_request.md
          gh pr comment "$PR" --body-file /tmp/claude_request.md
          if [ "$HAS_PAT" != "true" ]; then echo "::warning::Repair request posted with GITHUB_TOKEN — it will not start claude.yml. Set AI_LOOP_PAT or re-post the @claude comment by hand."; fi

      - name: Enforce gate
        env:
          ASTRA_CONFIGURED: ${{ steps.openai.outputs.configured }}
          ASTRA_DECISION: ${{ steps.astra.outputs.decision }}
          TEST_STATUS: ${{ steps.typecheck.outcome == 'success' && steps.test_node.outcome == 'success' && steps.test_py.outcome == 'success' && 'PASS' || 'FAIL' }}
          EVAL_EXIT: ${{ steps.evaluation.outputs.exit_code }}
          REPLAY_EXIT: ${{ steps.replay_eval.outputs.exit_code }}
        run: |
          test "$TEST_STATUS" = "PASS" || { echo "Tests not PASS"; exit 1; }
          # Operating record: invalid data blocks; a regression there is a monitor finding, not this PR's.
          case "${EVAL_EXIT:-2}" in 0|3) ;; *) echo "Operating-record evaluation invalid (exit ${EVAL_EXIT:-2})"; exit 1;; esac
          # PR evaluation: must have run (base replay available) and show no gated regression.
          test "${REPLAY_EXIT:-2}" = "0" || { echo "PR replay evaluation not passed (exit ${REPLAY_EXIT:-not run}); a PR without a base/head replay comparison has no performance evidence"; exit 1; }
          test "$ASTRA_CONFIGURED" = "true" || { echo "OPENAI_API_KEY missing"; exit 1; }
          test "$ASTRA_DECISION" = "PASS" || { echo "Astra did not PASS"; exit 1; }
          echo "All automated gates passed. Human merge approval remains required."
