name: HandiEdge — settle and score

# Fetches final scores for YESTERDAY's slate, settles every locked pick, runs
# the self-learning calibration update, and refreshes the running-results
# summary. Read it on a phone in the run summary or data/reports/summary.md.
#
# Two passes, because a late West Coast game (first pitch 22:10 ET) is often
# still in progress at the first one:
#   05:00 UTC = 14:00 JST = 01:00 ET — main pass, settles the finished games
#   07:00 UTC = 16:00 JST = 03:00 ET — straggler pass, runs ONLY if the first
#                                      pass left games unfinished
# Re-settling is safe: history keeps one report per date and the calibration is
# recomputed from the whole history, so nothing is ever learned from twice.
on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Slate date to settle (YYYY-MM-DD). Blank = yesterday (UTC)."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: handiedge-data
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve date
        id: d
        run: |
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then DATE=$(date -u -d 'yesterday' +%F); fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      # Runs when there is a locked slate AND something is still unsettled.
      # The 16:00 JST pass therefore no-ops on a normal night and only does
      # work when the 14:00 pass reported games still in progress.
      - name: Decide whether anything needs settling
        id: guard
        run: |
          DATE="${{ steps.d.outputs.date }}"
          LOCK="lib/sports-data/data/predictions/$DATE.json"
          RESULTS="lib/sports-data/data/results/$DATE.json"
          if [ ! -f "$LOCK" ]; then
            echo "No prediction lock for $DATE — nothing to settle."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f "$RESULTS" ]; then
            PENDING=$(node -e "console.log((JSON.parse(require('fs').readFileSync('$RESULTS','utf8')).pending||[]).length)")
            if [ "$PENDING" -eq 0 ]; then
              echo "$DATE is already fully settled — no games were left pending."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$PENDING game(s) were unfinished at the last pass — settling again."
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      # --force lets a re-run pick up games that were still in progress earlier.
      - name: Fetch final scores and settle
        if: steps.guard.outputs.run == 'true'
        working-directory: lib/sports-data
        run: pnpm run handiedge fetch-results --date "${{ steps.d.outputs.date }}" --force --settle

      - name: Refresh running results
        if: steps.guard.outputs.run == 'true'
        working-directory: lib/sports-data
        run: pnpm run handiedge report

      - name: Publish to run summary
        if: steps.guard.outputs.run == 'true'
        run: |
          cat "lib/sports-data/data/reports/${{ steps.d.outputs.date }}-settled.md" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat lib/sports-data/data/reports/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results and updated calibration
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/sports-data/data
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "HandiEdge: settled ${{ steps.d.outputs.date }}"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
