name: HandiEdge — settle and score

# Fetches final scores for YESTERDAY's slate, settles every locked pick, runs
# the self-learning calibration update, and refreshes the running-results
# summary. Read it on a phone in the run summary or data/reports/summary.md.
#
# 07:00 UTC = 16:00 JST = 03:00 ET. One pass is enough at this hour: the latest
# possible MLB start is 22:10 ET (02:10 UTC), so even a long extra-innings game
# is final well before it.
#
# Re-settling the same date is still safe by construction — history keeps one
# report per date and the calibration is recomputed from the whole history, so
# a manual re-run never learns from the same games twice.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Slate date to settle (YYYY-MM-DD). Blank = yesterday (UTC)."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: handiedge-data
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve date
        id: d
        run: |
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then DATE=$(date -u -d 'yesterday' +%F); fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      # Runs when there is a locked slate AND something is still unsettled, so
      # a repeat dispatch for an already-finished date is a no-op rather than
      # pointless work. Pass an explicit --date to settle a postponed game that
      # finished on a later day.
      - name: Decide whether anything needs settling
        id: guard
        run: |
          DATE="${{ steps.d.outputs.date }}"
          LOCK="lib/sports-data/data/predictions/$DATE.json"
          RESULTS="lib/sports-data/data/results/$DATE.json"
          if [ ! -f "$LOCK" ]; then
            echo "No prediction lock for $DATE — nothing to settle."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f "$RESULTS" ]; then
            PENDING=$(node -e "console.log((JSON.parse(require('fs').readFileSync('$RESULTS','utf8')).pending||[]).length)")
            if [ "$PENDING" -eq 0 ]; then
              echo "$DATE is already fully settled — no games were left pending."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$PENDING game(s) were unfinished last time — settling again."
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      # --force lets a re-run pick up anything unfinished last time.
      - name: Fetch final scores and settle
        if: steps.guard.outputs.run == 'true'
        working-directory: lib/sports-data
        run: pnpm run handiedge fetch-results --date "${{ steps.d.outputs.date }}" --force --settle

      - name: Refresh running results
        if: steps.guard.outputs.run == 'true'
        working-directory: lib/sports-data
        run: pnpm run handiedge report

      - name: Publish to run summary
        if: steps.guard.outputs.run == 'true'
        run: |
          cat "lib/sports-data/data/reports/${{ steps.d.outputs.date }}-settled.md" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat lib/sports-data/data/reports/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results and updated calibration
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/sports-data/data
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "HandiEdge: settled ${{ steps.d.outputs.date }}"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
