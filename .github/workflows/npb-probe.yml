name: NPB — data-source probe

# One-shot reconnaissance for NPB support. The dev sandbox has no egress to
# npb.jp or The Odds API, so this runner fetches real page/API samples and
# commits them under probe/npb/ for parser development — the same
# fixtures-first pattern the MLB client was built with. Safe to re-run;
# it only ever writes into probe/npb/ on the branch it was dispatched on.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: npb-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch samples
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -u
          DIR=probe/npb
          mkdir -p "$DIR"
          MANIFEST="$DIR/manifest.txt"
          : > "$MANIFEST"
          TODAY=$(TZ=Asia/Tokyo date +%Y%m%d)
          YEAR=$(TZ=Asia/Tokyo date +%Y)
          MONTH=$(TZ=Asia/Tokyo date +%m)
          # Yesterday matters as much as today for LINEUP work: clubs post
          # スタメン only a few hours before first pitch, so a probe that runs
          # in the JST morning sees today's card with no lineups on it at all.
          # A FINISHED game always carries the batting orders that actually
          # took the field, which is the sample a parser has to be built on.
          YESTERDAY=$(TZ=Asia/Tokyo date -d "yesterday" +%Y%m%d)

          fetch () { # fetch <name> <url>  (the manifest NEVER records the key)
            local name="$1" url="$2" code
            local shown="${url%%\?*}"
            code=$(curl -sSL --max-time 30 --max-filesize 3000000 \
              -A "Mozilla/5.0 (compatible; HandiEdgeProbe/1.0)" \
              -o "$DIR/$name" -w "%{http_code}" "$url" || echo "ERR")
            local bytes=0
            [ -f "$DIR/$name" ] && bytes=$(wc -c < "$DIR/$name")
            echo "$code $bytes $name $shown" | tee -a "$MANIFEST"
            # Keep only useful bodies: drop errors and empty files.
            if [ "$code" != "200" ] || [ "$bytes" -lt 200 ]; then
              rm -f "$DIR/$name"
            fi
          }

          # --- npb.jp: index pages first (link discovery beats guessed paths)
          fetch npb-top.html                "https://npb.jp/"
          fetch npb-games-index.html        "https://npb.jp/games/${YEAR}/"
          fetch npb-schedule-month.html     "https://npb.jp/games/${YEAR}/schedule_${MONTH}_detail.html"
          fetch npb-scores-today.html       "https://npb.jp/scores/${YEAR}/${TODAY:4:4}/"
          fetch npb-scores-yesterday.html   "https://npb.jp/scores/${YEAR}/${YESTERDAY:4:4}/"
          fetch npb-scores-index.html       "https://npb.jp/scores/"
          fetch npb-bis-stats-index.html    "https://npb.jp/bis/${YEAR}/stats/"
          fetch npb-bis-batting-central.html  "https://npb.jp/bis/${YEAR}/stats/bat_c.html"
          fetch npb-bis-batting-pacific.html  "https://npb.jp/bis/${YEAR}/stats/bat_p.html"
          fetch npb-bis-pitching-central.html "https://npb.jp/bis/${YEAR}/stats/pit_c.html"
          fetch npb-bis-pitching-pacific.html "https://npb.jp/bis/${YEAR}/stats/pit_p.html"
          fetch npb-bis-team-batting-c.html   "https://npb.jp/bis/${YEAR}/stats/tmb_c.html"
          fetch npb-bis-team-pitching-c.html  "https://npb.jp/bis/${YEAR}/stats/tmp_c.html"
          fetch npb-announcement-index.html "https://npb.jp/announcement/"
          fetch npb-starters.html           "https://npb.jp/announcement/${YEAR}/pitcher.html"

          # --- Lineups + roster moves (the two remaining honest data gaps).
          # Same link-discovery pattern as everything above: fetch the index,
          # extract real hrefs from its bytes, follow the first few. Guessed
          # deep paths rot; discovered ones are what the site actually serves.
          #
          # 1) Per-game score pages. Today's scores index links each game's
          #    own directory; the game page (and its siblings like box.html)
          #    is where npb.jp posts starting lineups (スタメン) once clubs
          #    announce them. Snapshot the first game's pages so a lineup
          #    parser can be built against real bytes.
          # Sample from BOTH days under the same naming scheme: the finished
          # (yesterday) game is the one guaranteed to carry batting orders,
          # while today's shows what the page looks like BEFORE lineups are
          # posted — the pre-deadline state the slate fetch actually meets,
          # and the case the parser must degrade honestly on.
          probe_game_pages () { # probe_game_pages <index-file> <label>
            local index="$DIR/$1" label="$2" path
            [ -f "$index" ] || return 0
            path=$(grep -oE 'href="/scores/[0-9]{4}/[0-9]{4}/[^"]+/"' "$index" \
              | head -1 | sed 's/href="//;s/"$//')
            if [ -z "$path" ]; then
              echo "SKIP - - no game link in $1" | tee -a "$MANIFEST"
              return 0
            fi
            fetch "npb-game-$label-index.html" "https://npb.jp${path}"
            fetch "npb-game-$label-box.html"   "https://npb.jp${path}box.html"
            fetch "npb-game-$label-playbyplay.html" \
              "https://npb.jp${path}playbyplay.html"
          }
          probe_game_pages npb-scores-yesterday.html finished
          probe_game_pages npb-scores-today.html     upcoming
          # 2) Roster moves (出場選手登録・抹消) — NPB's IL-equivalent feed.
          #    The announcement index links the daily roster pages; follow the
          #    first three distinct ones it actually advertises.
          if [ -f "$DIR/npb-announcement-index.html" ]; then
            N=0
            for REL in $(grep -oE 'href="(/announcement/[0-9]{4}/[^"]+\.html)"' \
              "$DIR/npb-announcement-index.html" | sed 's/href="//;s/"//' | sort -u | head -3); do
              N=$((N + 1))
              fetch "npb-roster-moves-$N.html" "https://npb.jp${REL}"
            done
            [ "$N" -eq 0 ] && echo "SKIP - - no announcement links found" | tee -a "$MANIFEST"
          fi
          # Round 2: Pacific team aggregates + one team's individual pages
          fetch npb-bis-team-batting-p.html   "https://npb.jp/bis/${YEAR}/stats/tmb_p.html"
          fetch npb-bis-team-pitching-p.html  "https://npb.jp/bis/${YEAR}/stats/tmp_p.html"
          fetch npb-bis-idp1-giants.html      "https://npb.jp/bis/${YEAR}/stats/idp1_g.html"
          fetch npb-bis-idb1-giants.html      "https://npb.jp/bis/${YEAR}/stats/idb1_g.html"
          fetch npb-standings-central.html    "https://npb.jp/bis/${YEAR}/stats/std_c.html"

          # --- The Odds API: does it carry NPB, and at what markets?
          if [ -n "${ODDS_API_KEY:-}" ]; then
            fetch odds-sports.json \
              "https://api.the-odds-api.com/v4/sports/?apiKey=${ODDS_API_KEY}&all=true"
            fetch odds-npb-h2h.json \
              "https://api.the-odds-api.com/v4/sports/baseball_npb/odds?apiKey=${ODDS_API_KEY}&regions=us,eu,au&markets=h2h,spreads,totals&oddsFormat=american&dateFormat=iso"
          else
            echo "SKIP - - ODDS_API_KEY unset" | tee -a "$MANIFEST"
          fi

          echo "--- manifest ---"
          cat "$MANIFEST"

      - name: Commit samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/npb
          if git diff --cached --quiet; then
            echo "No samples to commit."
          else
            git commit -m "NPB probe: data-source samples"
            git push
          fi
