name: HandiEdge — daily predictions

# Runs unattended so the tool is usable without a computer. Read the result on
# a phone either in the run summary (Actions tab) or in data/reports/<date>.md.
#
# Second half of a two-stage day. handiedge-slate.yml fetches the slate at
# 06:07 UTC (15:07 JST) and commits the control tower so the day's handicap
# lines can be typed into it; this job refreshes the same slate, reads whatever
# lines were entered, and freezes the picks. See that file for why the two are
# separate — briefly: when they ran in one job there was no moment at which a
# human could enter a line, so every slate in the tool's history was predicted
# at ハンデなし.
#
# LOCK against a 22:59 JST (13:59 UTC) deadline — the market itself closes
# at 23:00 JST. Every pre-deadline run re-locks on fresher data (lockedAt is
# honestly restamped); every run after the deadline carries the frozen picks
# through UNCHANGED (see cmdPredict), and once every pick is frozen the slate
# is no longer refetched at all (see "Is every pick already frozen?").
#
# The crons are designed around the scheduler delay this repository ACTUALLY
# gets, measured 2026-08-24..09-25 from each day's first commit: the first
# predict cron landed a median 3.9 h late (p90 5.5 h, max 9.9 h), the morning
# slate cron a median 5.4 h (max 11.5 h). The old design assumed 46–50 min
# (max 117 min) and put its "safety" lock at 11:40 UTC, so it landed around
# 15:30 UTC — after the deadline on 43 of 53 slates (578 of 716 games were
# fixed after the market had closed; 3 after first pitch).
#
#   02:10 UTC — the SAFETY lock: lands before 13:59 even at the worst delay
#               ever observed (11.5 h → 13:40). Slightly staler data is the
#               price; the refresh runs below re-lock while they still can.
#   05:20, 08:20, 09:50 UTC — REFRESH locks spread across the delay
#               distribution, so whatever the day's queue does, the last
#               lock before the deadline is as fresh as it can be.
#   11:40, 12:45 UTC — kept for fast-queue days; late landings are no-ops.
#
# Extra runs are free on a public repository and cost no odds credits once
# every game carries a line (fetch-slate skips the call) or the slate is
# frozen (the refetch is skipped). A scheduled run can still be dropped by
# GitHub under load; the spread is also the redundancy against that.
#
# The slate date is MLB's game date, which is the UTC date this job runs on.
on:
  schedule:
    - cron: "10 2 * * *"
    - cron: "20 5 * * *"
    - cron: "20 8 * * *"
    - cron: "50 9 * * *"
    - cron: "40 11 * * *"
    - cron: "45 12 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Slate date (YYYY-MM-DD). Blank = today (UTC)."
        required: false
        type: string
      force:
        description: "Re-lock a slate that is already locked (use after editing handicap lines)."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Never let predict and settle push at the same time.
concurrency:
  group: handiedge-data
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve date
        id: d
        run: |
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then DATE=$(date -u +%F); fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      # Once every pick's deadline has passed nothing can change — and
      # refetching would overwrite the committed slate that PRODUCED the
      # frozen picks (the inputs a replay needs) and spend odds credits for
      # nothing. So a fully frozen slate is left exactly as it was locked;
      # predict still runs over it to stamp the picks final.
      - name: Is every pick already frozen?
        id: frozen
        run: |
          LOCK="lib/sports-data/data/predictions/${{ steps.d.outputs.date }}.json"
          FROZEN=$(node -e '
            const fs = require("fs");
            const f = process.argv[1];
            if (!fs.existsSync(f)) { console.log("false"); process.exit(0); }
            const ps = JSON.parse(fs.readFileSync(f, "utf8")).predictions ?? [];
            const now = Date.now();
            const frozen = ps.length > 0 && ps.every((p) =>
              p.final === true ||
              (p.lockDeadline != null && Date.parse(p.lockDeadline) <= now));
            console.log(frozen ? "true" : "false");
          ' "$LOCK")
          echo "frozen=$FROZEN" >> "$GITHUB_OUTPUT"
          if [ "$FROZEN" = "true" ]; then
            echo "> Every pick for ${{ steps.d.outputs.date }} is already frozen — slate kept as locked (no refetch, no odds call)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ALWAYS --force. The morning slate job (handiedge-slate.yml) has
      # normally already written today's slate, and `fetch-slate` refuses to
      # run over an existing one without it — so without --force this step
      # would fail every single day the morning job succeeded.
      #
      # Refetching is also what we want: probables and season stats move
      # during the day, and this is the last read before the picks are frozen.
      # It is safe for the lines you entered, because `fetch-slate` never
      # overwrites an existing control tower — not even with --force.
      # ODDS_API_KEY fills any line still unentered at freeze time from
      # market consensus (entered lines are never touched).
      - name: Refresh slate (schedule, stats, bullpen usage, park factors, form)
        if: steps.frozen.outputs.frozen != 'true'
        working-directory: lib/sports-data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: pnpm run handiedge fetch-slate --date "${{ steps.d.outputs.date }}" --force

      # No games scheduled (off day, offseason) is normal, not a failure.
      - name: Check the slate has games
        id: guard
        run: |
          SLATE="lib/sports-data/data/slates/${{ steps.d.outputs.date }}.json"
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$SLATE','utf8')).games.length)")
          echo "Games on ${{ steps.d.outputs.date }}: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No games scheduled — nothing to predict." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Predict and lock
        if: steps.guard.outputs.run == 'true'
        working-directory: lib/sports-data
        run: |
          FORCE=""
          # Scheduled runs always --force: the refresh cron re-locks over the
          # safety lock (safe — after the deadline cmdPredict carries frozen
          # picks through unchanged). Manual dispatch keeps the explicit flag.
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          pnpm run handiedge predict \
            --control "data/control-towers/${{ steps.d.outputs.date }}.json" $FORCE

      # Say plainly whether the day's lines actually arrived. An unentered
      # line (null) quotes NO handicap market — honest, but a whole slate of
      # them means the odds fill failed or no key is set, and that should be
      # loud, not a quiet day.
      - name: Report how many real lines were used
        if: steps.guard.outputs.run == 'true'
        run: |
          node -e '
            const ct = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const all = Object.values(ct.handicaps ?? {});
            const entered = all.filter((h) => h.notation != null || h.line != null);
            const real = entered.filter((h) => String(h.notation ?? h.line) !== "0");
            const totals = all.filter((h) => h.total != null);
            console.log(
              entered.length === 0
                ? `> ⚠️ **No handicap lines were entered** — the handicap market was not ` +
                  `quoted for any of the ${all.length} games (moneyline and totals only). ` +
                  "Set the ODDS_API_KEY repo secret for automatic market lines, or edit " +
                  "the control tower after the morning slate job and commit before 22:30 JST."
                : `> **${real.length} of ${all.length} games** carried a real handicap line ` +
                  `(${entered.length} entered${totals.length ? `, ${totals.length} with a total` : ""}).`,
            );
            console.log("");
          ' "lib/sports-data/data/control-towers/${{ steps.d.outputs.date }}.json" \
            >> "$GITHUB_STEP_SUMMARY"

      # Step 9 — AI reviewer panel over the LOCKED slate (advisory only;
      # changes no pick). Runs only when the ANTHROPIC_API_KEY secret is set;
      # the command itself also skips cleanly without one. continue-on-error:
      # a briefing failure must never block the day's predictions landing.
      - name: AI review (advisory)
        if: steps.guard.outputs.run == 'true' && steps.frozen.outputs.frozen != 'true'
        continue-on-error: true
        working-directory: lib/sports-data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm run handiedge review --date "${{ steps.d.outputs.date }}"

      - name: Publish to run summary
        if: steps.guard.outputs.run == 'true'
        run: |
          cat "lib/sports-data/data/reports/${{ steps.d.outputs.date }}.md" >> "$GITHUB_STEP_SUMMARY"
          REVIEW="lib/sports-data/data/reviews/${{ steps.d.outputs.date }}.md"
          if [ -f "$REVIEW" ]; then cat "$REVIEW" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Commit today's slate and predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/sports-data/data
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "HandiEdge: predictions for ${{ steps.d.outputs.date }}"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
