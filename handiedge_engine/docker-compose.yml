services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: handiedge
      POSTGRES_PASSWORD: handiedge
      POSTGRES_DB: handiedge
    ports:
      - "5432:5432"
    volumes:
      - handiedge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handiedge -d handiedge"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        # Bake in the production XGBoost adapter so the real model runs here.
        INSTALL_XGBOOST: "true"
    depends_on:
      db:
        condition: service_healthy
    environment:
      HANDIEDGE_DATABASE_URL: postgresql+psycopg://handiedge:handiedge@db:5432/handiedge
      HANDIEDGE_ENVIRONMENT: docker
      HANDIEDGE_LOG_JSON: "true"
      # Run the real trained model (fallback_used=false). The entrypoint trains a
      # reproducible artifact on first boot if the mounted volume is empty.
      HANDIEDGE_MODEL_ADAPTER: xgboost
      HANDIEDGE_MODEL_ARTIFACT_DIR: /app/artifacts/xgboost_mlb
      HANDIEDGE_CALIBRATION_ARTIFACT_PATH: /app/artifacts/xgboost_mlb/calibration.json
    ports:
      - "8000:8000"
    volumes:
      # Persist the trained model artifact across restarts.
      - handiedge_models:/app/artifacts
    # Migrations + train-if-missing + serve are handled by the image entrypoint.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  handiedge_pgdata:
  handiedge_models:
